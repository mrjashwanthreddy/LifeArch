name: Build Check

on:
  push:
    branches:
      - master
      - dev

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Build the Spring Boot backend
  # ─────────────────────────────────────────────
  build-backend:
    name: 🏗️ Backend – Maven Build (${{ github.ref_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Make mvnw executable
        working-directory: life-arch-backend
        run: chmod +x mvnw

      - name: Build with Maven (skip tests)
        working-directory: life-arch-backend
        run: ./mvnw clean package -DskipTests

      - name: Upload backend JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-${{ github.ref_name }}
          path: life-arch-backend/target/*.jar
          retention-days: 3

  # ─────────────────────────────────────────────
  # Job 2: Build the React / Vite frontend
  # ─────────────────────────────────────────────
  build-frontend:
    name: ⚡ Frontend – Vite Build (${{ github.ref_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: life-arch-frontend/package-lock.json

      - name: Install dependencies
        working-directory: life-arch-frontend
        run: npm ci

      - name: Build frontend
        working-directory: life-arch-frontend
        run: npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.ref_name }}
          path: life-arch-frontend/dist/
          retention-days: 3
