services:
  db:
    image: postgres:16-alpine
    container_name: lifearch-db
    environment:
      POSTGRES_DB: lifearch
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./life-arch-backend
      dockerfile: Dockerfile
    container_name: lifearch-backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/lifearch
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      SPRING_SECURITY_PASSWORD: ${SPRING_SECURITY_PASSWORD:-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./life-arch-frontend
      dockerfile: Dockerfile
    container_name: lifearch-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend
